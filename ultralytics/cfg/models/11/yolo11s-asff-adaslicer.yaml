# YOLO11 + PAN-FPN neck + ASFF (3 levels) + AdaSlicerGate
# Parameters
nc: 10 # number of classes
scales: # [depth, width, max_channels]
  # n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11 backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# Neck: plain top-down/bottom-up PAN, then ASFF re-fuses all 3 levels per output level
# ASFF args: [level]  (0=P3, 1=P4, 2=P5); output channels = channels of that level's input
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11
  - [[-1, 6], 1, Concat, [1]]                    # 12 cat backbone P4
  - [-1, 2, C3k2, [512, False]]                  # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14
  - [[-1, 4], 1, Concat, [1]]                    # 15 cat backbone P3
  - [-1, 2, C3k2, [256, False]]                  # 16 (P3/8)

  - [-1, 1, Conv, [256, 3, 2]]                   # 17
  - [[-1, 13], 1, Concat, [1]]                   # 18 cat head P4
  - [-1, 2, C3k2, [512, False]]                  # 19 (P4/16)

  - [-1, 1, Conv, [512, 3, 2]]                   # 20
  - [[-1, 10], 1, Concat, [1]]                   # 21 cat head P5
  - [-1, 2, C3k2, [1024, True]]                  # 22 (P5/32)

  - [[16, 19, 22], 1, ASFF, [0]]                 # 23 ASFF -> P3
  - [[16, 19, 22], 1, ASFF, [1]]                 # 24 ASFF -> P4
  - [[16, 19, 22], 1, ASFF, [2]]                 # 25 ASFF -> P5

  - [23, 1, AdaSlicerGate, []]                   # 26 gate P3
  - [24, 1, AdaSlicerGate, []]                   # 27 gate P4

  - [[26, 27, 25], 1, Detect, [nc]]              # Detect(P3_gated, P4_gated, P5)
