# YOLO11 + AFPN (asymptotic fusion: P3+P4 first, then P5 joins) + AdaSlicerGate
# Parameters
nc: 10 # number of classes
scales: # [depth, width, max_channels]
  # n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11 backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# ASFF2 = 2-level adaptive fusion, ASFF3 = 3-level adaptive fusion. args: [level]
# Output channels = channels of that level's input (so C3k2/Conv scale with width automatically)
head:
  # compress backbone levels
  - [4, 1, Conv, [128, 1, 1]]                    # 11 P3
  - [6, 1, Conv, [256, 1, 1]]                    # 12 P4
  - [10, 1, Conv, [512, 1, 1]]                   # 13 P5

  # stage 1: fuse only adjacent levels P3 <-> P4
  - [[11, 12], 1, ASFF2, [0]]                    # 14 -> P3
  - [[11, 12], 1, ASFF2, [1]]                    # 15 -> P4
  - [14, 2, C3k2, [128, False]]                  # 16
  - [15, 2, C3k2, [256, False]]                  # 17

  # stage 2: P5 joins asymptotically
  - [[16, 17, 13], 1, ASFF3, [0]]                # 18 -> P3
  - [[16, 17, 13], 1, ASFF3, [1]]                # 19 -> P4
  - [[16, 17, 13], 1, ASFF3, [2]]                # 20 -> P5
  - [18, 2, C3k2, [128, False]]                  # 21 (P3/8)
  - [19, 2, C3k2, [256, False]]                  # 22 (P4/16)
  - [20, 2, C3k2, [512, True]]                   # 23 (P5/32, ungated)

  - [21, 1, AdaSlicerGate, []]                   # 24 gate P3
  - [22, 1, AdaSlicerGate, []]                   # 25 gate P4

  - [[24, 25, 23], 1, Detect, [nc]]              # Detect(P3_gated, P4_gated, P5)
