# YOLO11 + HS-FPN (high-frequency perception + spatial dependency perception) + AdaSlicerGate
# Parameters
nc: 10 # number of classes
scales: # [depth, width, max_channels]
  # n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11 backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# HFP args: []  -> high-frequency perception (high-pass filter + channel attention), channel-preserving
# SDP args: []  -> input [fine, coarse]; coarse level is fused into fine via spatial dependency (cross-attention), out ch = fine ch
head:
  # unify channels
  - [4, 1, Conv, [256, 1, 1]]                    # 11 P3
  - [6, 1, Conv, [256, 1, 1]]                    # 12 P4
  - [10, 1, Conv, [256, 1, 1]]                   # 13 P5

  # high-frequency perception on every level
  - [11, 1, HFP, []]                             # 14 P3
  - [12, 1, HFP, []]                             # 15 P4
  - [13, 1, HFP, []]                             # 16 P5

  # top-down spatial dependency fusion
  - [[15, 16], 1, SDP, []]                       # 17 P4 <- P5
  - [[14, 17], 1, SDP, []]                       # 18 P3 <- fused P4

  # refine
  - [18, 2, C3k2, [256, False]]                  # 19 (P3/8)
  - [17, 2, C3k2, [512, False]]                  # 20 (P4/16)
  - [16, 2, C3k2, [1024, True]]                  # 21 (P5/32, ungated)

  - [19, 1, AdaSlicerGate, []]                   # 22 gate P3
  - [20, 1, AdaSlicerGate, []]                   # 23 gate P4

  - [[22, 23, 21], 1, Detect, [nc]]              # Detect(P3_gated, P4_gated, P5)
